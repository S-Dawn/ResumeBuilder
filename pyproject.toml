[project]
name = "resumebuilder-tools"
version = "1.0.2"
description = "Profile-driven ATS-friendly resume generator engine for ResumeBuilder agent skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Subham Dawn", email = "coder.sdawn@gmail.com" }]
keywords = ["resume", "pdf", "weasyprint", "yaml", "cv", "ats"]
dependencies = [
    "weasyprint>=70.0,<71.0",
    "pydyf>=0.10,<0.12",
    "pypdf>=6.21.3,<7.0",
    "pillow>=13.0,<14.0",
    "pyyaml>=6.0.2,<7.0",
]

[project.scripts]
resumebuilder-tools = "python_engine.resume_tools:main"

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_engine"]
