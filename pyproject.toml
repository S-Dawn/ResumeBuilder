[tool.poetry]
name = "resume-builder"
version = "0.1.0"
description = "Profile-driven ATS-friendly resume generator with WeasyPrint validation"
authors = ["Subham Dawn <coder.sdawn@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/S-Dawn/ResumeBuilder"
keywords = ["resume", "pdf", "weasyprint", "yaml", "cv"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
weasyprint = "^62.3"
pydyf = ">=0.10,<0.12"
pyyaml = "^6.0.2"
pypdf = "^5.4.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
